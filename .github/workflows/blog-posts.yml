name: Latest blog posts

# Once a day, lists the five newest posts from https://hackmakedo.com/blog/rss.xml
# between the BLOG-POST-LIST comments in README.md, and commits only if they changed.
# Run it by hand from the Actions tab to update straight after publishing a post.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: 'https://hackmakedo.com/blog/rss.xml'
          max_post_count: 5
          commit_message: 'Update the latest blog posts'
